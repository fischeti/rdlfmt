# Runs on the same tag as release.yml, rather than as a dist publish-job.
#
# The wheels contain the Rust binary and no Python code (maturin's `bin`
# bindings), so they are tagged `py3-none-<platform>`: one build per platform,
# with no interpreter dimension to the matrix.
#
# This does rebuild binaries that dist already built for the GitHub Release.
# The artifacts are not interchangeable -- a wheel has to be produced by the
# backend that stamps its platform tag, and on Linux that tag has to be earned
# by building against an old glibc -- so the duplicate work is the price of
# both channels being correct.
name: Publish to PyPI

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  wheels:
    name: wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { runner: ubuntu-latest,  target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest,  target: x86_64,  manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest,  target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-latest,   target: aarch64, manylinux: auto }
          - { runner: macos-15-intel, target: x86_64,  manylinux: auto }
          - { runner: windows-latest, target: x64,     manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      # `manylinux: auto` builds inside a manylinux container, which is what
      # earns the manylinux_2_17 tag. PyPI rejects a wheel tagged plain `linux`,
      # so this is a hard requirement on Linux rather than a nicety. It is
      # ignored on macOS and Windows.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing. Configure the publisher on PyPI
      # (project settings -> publishing) so no API token has to be stored here.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
