# Runs on the same tag as release.yml, rather than as a dist publish-job.
#
# Trusted publishing identifies the caller by workflow filename, and every dist
# hook is a reusable workflow, which that mechanism does not reliably support.
# A top-level workflow keeps the tokenless path available; the cost is that
# dist's release announcement no longer waits on this job.
#
# Auth is crates.io Trusted Publishing: the OIDC token GitHub mints here is
# exchanged for a short-lived registry token, so there is no
# CARGO_REGISTRY_TOKEN secret to store or rotate. This requires the crate to
# already exist -- crates.io has no pending-publisher flow, so the first
# version must be published by hand.
name: Publish to crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required to mint the OIDC token that the auth action trades in.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable

      # Publishing the same version twice is a hard error, so a release that
      # got part-way through cannot simply be re-run. Checking first makes this
      # job idempotent: it publishes when there is something to publish and
      # succeeds quietly when there is not.
      #
      # The sparse index is the source of truth here rather than the web API,
      # which rate-limits and answers a throttled request with an error body
      # that is easy to misread as "no such crate".
      - name: Check whether this version is already published
        id: check
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          name=$(jq -r '.packages[0].name' <<<"$metadata")
          version=$(jq -r '.packages[0].version' <<<"$metadata")
          # Index layout: short names get their own buckets, everything from
          # four characters up is bucketed by its first four.
          case ${#name} in
            1) index_path="1/$name" ;;
            2) index_path="2/$name" ;;
            3) index_path="3/${name:0:1}/$name" ;;
            *) index_path="${name:0:2}/${name:2:2}/$name" ;;
          esac
          # A 404 means the crate has never been published, so curl failing
          # here has to fall through to publishing rather than abort the job.
          if curl -sf "https://index.crates.io/$index_path" \
               | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            echo "$name $version is already on crates.io; nothing to publish"
            echo "needed=false" >>"$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io yet"
            echo "needed=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.needed == 'true'
        id: auth
      - run: cargo publish --locked
        if: steps.check.outputs.needed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
