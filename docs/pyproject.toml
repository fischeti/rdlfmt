# The documentation site is its own uv project, deliberately separate from the
# `rdlfmt` package at the repository root: building the docs should not need a
# Rust toolchain, and pinning Sphinx should not touch the wheel's metadata.
#
#   uv run --project docs sphinx-build -b html docs docs/_build/html
[project]
name = "rdlfmt-docs"
version = "0"
description = "Documentation for rdlfmt"
requires-python = ">=3.11"
dependencies = [
    "sphinx>=8.1",
    "sphinx-book-theme>=1.1",
    "sphinx-copybutton>=0.5",
    # The Pygments lexer PeakRDL's own docs use, so `.. code-block:: systemrdl`
    # is highlighted rather than dumped as plain text.
    "pygments-systemrdl>=1.3",
]

[tool.uv]
# Nothing here is importable; there is no package to build.
package = false
